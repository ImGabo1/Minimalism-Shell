# Brave (Chromium): en NVIDIA+Wayland la ruta de presentación de vídeo HW
# (VAAPI → EGLImage) falla con eglCreateImage 0x3009 y el vídeo se queda en
# una imagen fija con el audio corriendo. Desactiva solo esa ruta: Brave
# reproduce por software; mpv/Firefox siguen decodificando en la GPU (VAAPI).
--disable-features=AcceleratedVideoDecodeLinuxGL

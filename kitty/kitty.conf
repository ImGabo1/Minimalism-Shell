font_family JetBrainsMono NF Bold
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

# --- Copiar / Pegar cómodo (Wayland) ---
# Seleccionar con el ratón (arrastrar y sombrear) ya COPIA al portapapeles del
# sistema: con sombrear y Ctrl+V pegas en cualquier app. No hace falta atajo.
copy_on_select clipboard
# Clic central = pegar la selección
mouse_map middle        release ungrabbed paste_from_selection
# Teclado: Ctrl+Shift+C copia, Ctrl+Shift+V pega.
# (Ctrl+C NO puede ser copiar: en terminales es la tecla de interrupción.)
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard

include colors.conf

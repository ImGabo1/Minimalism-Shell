font_family JetBrainsMono NF Bold
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

# --- Copiar / Pegar cómodo (Wayland) ---
# Teclado
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard
# Ratón: arrastrar para seleccionar y SOLTAR = copia al portapapeles del sistema
# (así pegas en cualquier otra app), clic central = pega.
mouse_map left          release ungrabbed mouse_copy_selection
mouse_map middle        release ungrabbed paste_from_clipboard

include colors.conf
